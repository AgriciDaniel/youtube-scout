[project]
name = "youtube-scout"
version = "0.2.0"
description = "Claude Code skill: one topic in, one ranked YouTube research workbook out. Videos, channels, comments, hooks, and replay hotspots via YouTube Data API v3 and yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Agrici" }]
keywords = ["claude-code", "claude-skill", "youtube", "youtube-data-api", "research", "xlsx"]
dependencies = ["openpyxl>=3.1.5,<4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "detect-secrets>=1.5"]

[project.urls]
Repository = "https://github.com/AgriciDaniel/youtube-scout"
Issues = "https://github.com/AgriciDaniel/youtube-scout/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
